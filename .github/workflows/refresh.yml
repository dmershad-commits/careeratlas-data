name: Refresh official job summaries
on:
  schedule:
    - cron: '0 2,14 * * *'
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: careeratlas-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check whether refresh is due
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          due=os.environ["EVENT_NAME"]!="schedule" or os.environ["CRON"]=="0 2,14 * * *"
          reason="primary schedule or manual request"
          if not due:
              try:
                  status=json.loads(Path("public/status.json").read_text())
                  receipt=json.loads(Path("public/scheduler.json").read_text())
                  last=datetime.fromisoformat(status["generated_at"])
                  age=(datetime.now(timezone.utc)-last).total_seconds()
                  now=datetime.now(timezone.utc)
                  slot=now.replace(hour=14 if now.hour>=14 else 2,minute=0,second=0,microsecond=0)
                  if now.hour<2:
                      from datetime import timedelta
                      slot=(slot-timedelta(days=1)).replace(hour=14)
                  due=last<slot or age>=43200 or age<0 or receipt["event"]!="schedule"
                  reason="catalogue overdue" if due else "catalogue is current"
              except (OSError,ValueError,KeyError,TypeError):
                  due=True
                  reason="initial automatic verification or missing status"
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write(f"refresh={str(due).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write(f"Refresh needed: {due}. Reason: {reason}.\n")
          PY
      - uses: actions/setup-python@v5
        if: steps.due.outputs.refresh == 'true'
        with:
          python-version: '3.12'
      - name: Prepare collector and restore published state
        if: steps.due.outputs.refresh == 'true'
        run: |
          unzip -q -o collector.zip -d runtime
          unzip -q -o repairs.zip -d runtime
          python add_sources.py runtime
          python add_un_sources.py runtime
          cp test_expansion.py runtime/test_expansion.py
          PYTHONPATH=runtime/collector python test_un_sources.py
          mkdir -p runtime/dist public
          if [ -f public/state.json.gz ]; then cp public/state.json.gz runtime/public/state.json.gz; fi
      - name: Test state isolation
        if: steps.due.outputs.refresh == 'true'
        working-directory: runtime
        run: |
          python test_cloud.py
          python test_repairs.py
          python test_expansion.py
      - name: Collect and validate official sources
        if: steps.due.outputs.refresh == 'true'
        working-directory: runtime
        run: python cloud_refresh.py
      - name: Audit official application links
        if: steps.due.outputs.refresh == 'true'
        run: |
          if [ -f public/link-health.json ]; then cp public/link-health.json runtime/public/; fi
          python quality_audit.py runtime
          cp runtime/public/link-health.json public/
      - name: Publish public data
        if: steps.due.outputs.refresh == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          cp runtime/public/jobs.json.gz runtime/public/state.json.gz runtime/public/status.json public/
          python - <<'PY'
          import json,os
          from pathlib import Path
          status=json.loads(Path("public/status.json").read_text())
          if os.environ["EVENT_NAME"]=="schedule":
              receipt={"event":"schedule","cron":os.environ["CRON"],"generated_at":status["generated_at"],"run_url":status["run_url"]}
              Path("public/scheduler.json").write_text(json.dumps(receipt,indent=2))
          PY
          git config user.name "careeratlas-updater"
          git config user.email "careeratlas-updater@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official-source job summaries"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
