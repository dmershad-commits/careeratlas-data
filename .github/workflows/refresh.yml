name: Refresh official job summaries
on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: careeratlas-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare collector and restore published state
        run: |
          unzip -q -o collector.zip -d runtime
          unzip -q -o repairs.zip -d runtime
          mkdir -p runtime/dist public
          if [ -f public/state.json.gz ]; then cp public/state.json.gz runtime/public/state.json.gz; fi
      - name: Test state isolation
        working-directory: runtime
        run: |
          python test_cloud.py
          python test_repairs.py
      - name: Collect and validate official sources
        working-directory: runtime
        run: python cloud_refresh.py
      - name: Publish public data
        run: |
          cp runtime/public/jobs.json.gz runtime/public/state.json.gz runtime/public/status.json public/
          git config user.name "careeratlas-updater"
          git config user.email "careeratlas-updater@users.noreply.github.com"
          git add public/jobs.json.gz public/status.json public/state.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official-source job summaries"
            git push origin HEAD:main
          fi
